{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Reservas{% endblock %}</title>
    <!-- Tipografías -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!--CSS personalizado -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <div class="hero-section d-flex">
        
        <!-- Menú Lateral Izquierdo Fijo -->
        <aside class="custom-sidebar d-flex flex-column flex-shrink-0">
            <div class="border-bottom border-secondary border-opacity-25 px-4 py-3">
                <a class="logo text-decoration-none" href="/">RESERVAS</a>
            </div>
            
            <div class="px-3 py-4">
                <nav class="nav flex-column gap-2 sidebar-nav">
                    <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">
                        <i class="bi bi-house-door me-2"></i> Inicio
                    </a>
                    <a class="nav-link {% if 'roles' in request.path %}active{% endif %}" href="{% url 'roles' %}">
                        <i class="bi bi-shield-lock me-2"></i> Roles
                    </a>
                    <a class="nav-link {% if 'usuarios' in request.path %}active{% endif %}" href="{% url 'usuarios' %}">
                        <i class="bi bi-people me-2"></i> Usuarios
                    </a>
                    <a class="nav-link {% if 'restaurantes' in request.path %}active{% endif %}" href="#">
                        <i class="bi bi-shop me-2"></i> Restaurantes
                    </a>
                    <a class="nav-link {% if 'sectores' in request.path %}active{% endif %}" href="#">
                        <i class="bi bi-layers me-2"></i> Sectores
                    </a>
                    <a class="nav-link {% if 'mesas' in request.path %}active{% endif %}" href="#">
                        <i class="bi bi-layout-wtf me-2"></i> Mesas
                    </a>
                    <a class="nav-link {% if 'reservas' in request.path %}active{% endif %}" href="#">
                        <i class="bi bi-calendar-check me-2"></i> Reservas
                    </a>
                </nav>
            </div>
        </aside>

        <!-- Área Derecha: Contenido de cada página-->
        <div class="flex-grow-1 d-flex flex-column justify-content-between">
            
            <main class="flex-grow-1 d-flex flex-column">
                {% block content %}{% endblock %}
            </main>

            
        </div>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

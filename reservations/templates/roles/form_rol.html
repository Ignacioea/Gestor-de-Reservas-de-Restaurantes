{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card border-0 shadow-lg mx-auto" style="max-width: 650px; background-color: rgba(25, 22, 19, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(212, 163, 89, 0.25) !important;">
        <div class="card-header border-bottom border-secondary py-3" style="background-color: rgba(212, 163, 89, 0.12);">
            <h4 class="mb-0" style="color: #e5b869;">Agregar Rol</h4>
        </div>
        <div class="card-body p-4 text-light">
            <form action="" method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="id_nombre" class="form-label">Nombre del Rol:</label>
                    {{ form.nombre }}
                    {% if form.nombre.errors %}
                        <div class="text-danger small mt-1">{{ form.nombre.errors }}</div>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label for="id_descripcion" class="form-label">Descripción:</label>
                    {{ form.descripcion }}
                    {% if form.descripcion.errors %}
                        <div class="text-danger small mt-1">{{ form.descripcion.errors }}</div>
                    {% endif %}
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="{% url 'roles' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn fw-semibold" style="background-color: #d4a359; color: #181512;">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0 text-white fw-bold">Gestión de Roles</h2>
        <a href="{% url 'crear_rol' %}" class="btn fw-semibold px-3" style="background-color: #d4a359; color: #181512;">
            + Nuevo Rol
        </a>
    </div>

    <div class="card border-0 shadow-lg" style="background-color: rgba(25, 22, 19, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(212, 163, 89, 0.25) !important;">
        <div class="card-header border-bottom border-secondary py-3" style="background-color: rgba(212, 163, 89, 0.12);">
            <strong style="color: #e5b869;">Roles Registrados</strong>
        </div>
        <div class="card-body p-0">
            <table class="table table-dark table-hover align-middle mb-0" style="--bs-table-bg: transparent; --bs-table-hover-bg: rgba(212, 163, 89, 0.1);">
                <thead>
                    <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.15); color: #d4a359;">
                        <th class="ps-4">ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th class="pe-4 text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for rol in roles %}
                    <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.08);">
                        <td class="ps-4 text-light">{{ rol.id }}</td>
                        <td class="text-light opacity-75">{{ rol.nombre }}</td>
                        <td class="text-light opacity-75">{{ rol.descripcion }}</td>
                        <td class="pe-4 text-end">
                            <a href="{% url 'editar_rol' rol.id %}" class="btn btn-sm btn-outline-warning me-1">Editar</a>
                            <a href="{% url 'eliminar_rol' rol.id %}" class="btn btn-sm btn-outline-danger">Eliminar</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4 ">No hay roles registrados aún.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
